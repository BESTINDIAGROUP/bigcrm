<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best India Group CRM</title>
<meta name="theme-color" content="#0D4084">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BIG CRM">
<style>
  html,body{margin:0;height:100%;background:#ffffff;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #splash{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:#fff;transition:opacity .5s ease}
  
  #bp,#wp{position:absolute;top:0;bottom:0;width:50%;z-index:2;backface-visibility:hidden}
  #bp{left:0;transform-origin:0 50%;background:#0F458B;box-shadow:none;animation:doorL 1s cubic-bezier(.55,0,.25,1) .35s forwards}
  #wp{right:0;transform-origin:100% 50%;background:#ffffff;box-shadow:none;border-left:2px solid #0F458B;animation:doorR 1s cubic-bezier(.55,0,.25,1) .35s forwards}
  @keyframes doorL{0%{transform:perspective(2400px) rotateY(0)}100%{transform:perspective(2400px) rotateY(90deg)}}
  @keyframes doorR{0%{transform:perspective(2400px) rotateY(0)}100%{transform:perspective(2400px) rotateY(-90deg)}}
  #logo{z-index:3}
  #splash.out{opacity:0}
  #logo{position:relative;width:min(40vw,40vh,260px);aspect-ratio:1/1}
  #logo .pc{position:absolute;background-image:var(--img);background-repeat:no-repeat;will-change:transform,opacity;box-shadow:0 2px 6px rgba(13,64,132,.25);
    opacity:0;animation:fly 1.05s cubic-bezier(.35,.1,.45,1) forwards;animation-delay:var(--dl)}
  @keyframes fly{
    0%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.6)}
    8%{opacity:1}
    35%{transform:translate(var(--x1),var(--y1)) rotate(calc(var(--r)*.6)) scale(.75)}
    65%{transform:translate(var(--x2),var(--y2)) rotate(calc(var(--r)*.25)) scale(.9)}
    86%{transform:translate(0,-6px) rotate(0) scale(1.12)}
    100%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}
  #full{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .2s ease;filter:drop-shadow(0 16px 26px rgba(13,64,132,.35))}
  #logo.done #full{opacity:1}
  #logo.done .pc{visibility:hidden}
  #logo.done{animation:pop .5s cubic-bezier(.2,.9,.25,1.25)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
  #shine{position:absolute;inset:0;overflow:hidden;border-radius:12%;pointer-events:none;opacity:0}
  #shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:35%;left:-60%;transform:skewX(-20deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
  #logo.done #shine{opacity:1}
  #logo.done #shine::after{animation:sh .9s ease .15s forwards}
  @keyframes sh{to{left:130%}}
  #glow{position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,rgba(120,170,255,.35),transparent 60%);opacity:0;transition:opacity .6s ease}
  #logo.done #glow{opacity:1}
  @media (prefers-reduced-motion:reduce){#logo .pc{display:none}#full{opacity:1}}
</style>
</head>

<script>
(function(){
  var t0=Date.now(),loaded=false,done=false,s=document.getElementById('splash'),L=document.getElementById('logo'),img=document.getElementById('full').src;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* pieces of the logo come from all over the screen and join into one logo */
  var N=7,W=L.offsetWidth,c=W/N,vm=Math.max(innerWidth,innerHeight);
  L.style.setProperty('--img','url("'+img+'")');
  if(!reduce){for(var r=0;r<N;r++)for(var k=0;k<N;k++){
    var p=document.createElement('div');p.className='pc';
    var sx=(Math.random()-.5)*innerWidth*0.9,sy=-(innerHeight*(0.55+Math.random()*0.5))-r*c,sw=(Math.random()<.5?-1:1)*(18+Math.random()*30);
    p.style.cssText='left:'+(k*c)+'px;top:'+(r*c)+'px;width:'+(c+0.6)+'px;height:'+(c+0.6)+'px;background-size:'+W+'px '+W+'px;background-position:'+(-k*c)+'px '+(-r*c)+'px;'+
      '--x:'+Math.round(sx)+'px;--y:'+Math.round(sy)+'px;--x1:'+Math.round(sx*.55+sw)+'px;--y1:'+Math.round(sy*.55)+'px;--x2:'+Math.round(sx*.2-sw)+'px;--y2:'+Math.round(sy*.2)+'px;'+'--r:'+Math.round(Math.random()*360-180)+'deg;--dl:'+(1.05+Math.random()*0.45).toFixed(2)+'s';
    L.appendChild(p)}}
  setTimeout(function(){L.className="done"},reduce?0:2600);
  function hide(){if(done)return;done=true;s.className='out';setTimeout(function(){s.style.display='none'},550)}
  function tryHide(){if(loaded&&Date.now()-t0>=3500)hide()}
  document.getElementById('app').addEventListener('load',function(){loaded=true;tryHide()});
  setTimeout(tryHide,3500);
  setTimeout(hide,9000);
})();
</script>
<script>
/* ===== alerts on this phone / laptop (messages come from the CRM inside the frame) ===== */
(function(){
  var reg=null,base=document.title;
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(function(r){reg=r}).catch(function(){})}
  function perm(){return 'Notification' in window?Notification.permission:'none'}
  function tell(){try{document.getElementById('app').contentWindow.postMessage({bigPerm:perm()},'*')}catch(e){}}
  function show(n){if(perm()!=='granted')return;var o={body:n.body||'',icon:'icon-192.png',badge:'icon-192.png',tag:n.tag||'big',renotify:true,vibrate:[200,100,200]};
    (reg?reg.showNotification(n.title||'Best India Group CRM',o):Promise.reject()).catch(function(){try{new Notification(n.title||'Best India Group CRM',o)}catch(e){}})}
  window.addEventListener('message',function(ev){var d=ev.data||{};
    if(d.bigPermQ)tell();
    if(d.bigAskPerm&&'Notification' in window){try{Notification.requestPermission().then(tell,tell)}catch(e){Notification.requestPermission(tell)}}
    if(d.bigNotify)show(d.bigNotify);
    if(typeof d.bigCount==='number'){document.title=d.bigCount>0?'('+d.bigCount+') '+base:base;try{if(navigator.setAppBadge){d.bigCount>0?navigator.setAppBadge(d.bigCount):navigator.clearAppBadge()}}catch(e){}}
  });
})();
</script>
<script>
/* ===== keep the CRM login and the page you were on across a refresh (Ctrl+R) =====
   Some browsers (iPhone Safari, Brave, private windows) do not keep data saved inside the CRM frame,
   so the CRM also hands its login to this page, and asks for it back when it starts. */
(function(){
  var K='big-crm-sess',V='big-crm-view';
  function ok(o){return /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(o||'')}
  function get(k){try{var s=localStorage.getItem(k);return s?JSON.parse(s):null}catch(e){return null}}
  function put(k,v){try{v?localStorage.setItem(k,JSON.stringify(v)):localStorage.removeItem(k)}catch(e){}}
  window.addEventListener('message',function(ev){var d=ev.data||{};if(!ok(ev.origin))return;
    if(d.bigSessQ){try{ev.source.postMessage({bigSess:get(K),bigView:get(V)},ev.origin)}catch(e){}}
    if('bigSessSet' in d){put(K,d.bigSessSet);if(!d.bigSessSet)put(V,null)}
    if('bigViewSet' in d)put(V,d.bigViewSet);
  });
})();
</script>

      .then(function(t){if(t){tok=t;send()}}).catch(function(){})}
  window.addEventListener('message',function(ev){var d=ev.data||{};if(d.bigPushQ){src=ev.source;if(tok)send();else getTok()}});
  if(msg){try{msg.onMessage(function(p){var n=(p&&p.notification)||{};if(document.hidden&&Notification.permission==='granted'&&navigator.serviceWorker){navigator.serviceWorker.ready.then(function(r){r.showNotification(n.title||'Best India Group CRM',{body:n.body||'',icon:'icon-192.png',badge:'icon-192.png',tag:'big-push',renotify:true})})}})}catch(e){}}
  function bar(){
    var b=document.getElementById('pushbar'),ios=/iPhone|iPad|iPod/.test(navigator.userAgent),home=window.navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches),
        can='Notification' in window&&'serviceWorker' in navigator,need=can?Notification.permission==='default':(ios&&!home);
    if(!need){if(b)b.remove();return}if(b)return;
    b=document.createElement('div');b.id='pushbar';
    b.style.cssText='position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:10px;align-items:center;justify-content:space-between;background:#0F458B;color:#fff;padding:10px 12px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.28);font:600 14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif';
    var bs='border:0;border-radius:8px;padding:8px 12px;font:700 13px system-ui,sans-serif;cursor:pointer';
    b.innerHTML=can?'<span>&#128276; Get task alerts on this phone, even when the CRM is closed</span><span style="white-space:nowrap"><button id="pbOn" style="'+bs+';background:#fff;color:#0F458B">Turn on</button> <button id="pbX" aria-label="Close" style="'+bs+';background:transparent;color:#fff">&#10005;</button></span>'
                   :'<span>&#128276; To get alerts on iPhone: tap Share &#11014;&#65039; then <b>Add to Home Screen</b>, and open the CRM from that icon.</span><button id="pbX" aria-label="Close" style="'+bs+';background:transparent;color:#fff">&#10005;</button>';
    document.body.appendChild(b);
    var on=document.getElementById('pbOn');if(on)on.onclick=function(){Notification.requestPermission().then(function(p){if(p==='granted')getTok();bar()})};
    document.getElementById('pbX').onclick=function(){b.remove();try{sessionStorage.setItem('pbx','1')}catch(e){}};
  }
  setTimeout(function(){try{if(sessionStorage.getItem('pbx'))return}catch(e){}bar()},4500);
  if('Notification' in window&&Notification.permission==='granted')getTok();
})();
</script>
